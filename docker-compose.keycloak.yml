version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hyundai_hub
      POSTGRES_USER: hyundai
      POSTGRES_PASSWORD: hyundai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hyundai_hub
      KC_DB_USERNAME: hyundai
      KC_DB_PASSWORD: hyundai123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
